# API do PMS, o sistema de gestão do hotel (simulada). Escuta SÓ na porta 8443, com HTTPS de certificado autoassinado.
server {
    listen 8443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/lab.crt;
    ssl_certificate_key /etc/nginx/certs/lab.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Usado pelo healthcheck do Compose
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Resposta de exemplo (dados FICTICIOS)
    location = /api/reservas/1 {
        default_type application/json;
        return 200 '{"sistema":"pms","reserva":1,"quarto":"101","hospede":"Hospede 1","consumo":"Frigobar","observacao":"dados ficticios"}\n';
    }
}